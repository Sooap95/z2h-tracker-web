<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- viewport-fit + user-scalable=no : évite le zoom involontaire au double-tap
     sur les steppers, le fléau des saisies entre deux séries. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>z2h — séance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Contexte d'usage (§9) : salle de sport, mains moites, lumière médiocre.
     → fond graphite, masse typographique, cibles ≥ 56 px, zéro navigation.
     Direction « instrument de mesure » : Oswald = la masse (charges, titres),
     IBM Plex Mono = la précision (méta, deltas, libellés). */
  :root {
    --bg: #0B0C0E; --surface: #14161A; --line: #262A30;
    --txt: #E6E4DE; --dim: #8A8F98; --ghost: #565B63;
    --blue: #7FA5F5; --blue-solid: #2F62C9; --amber: #D9A13B;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    padding: 12px 10px calc(28px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  a { color: var(--blue); } a:hover { color: #A8C2F8; }
  h1 {
    font-family: Oswald, sans-serif; font-weight: 700; font-size: 26px;
    text-transform: uppercase; letter-spacing: .02em; margin: 8px 0 2px;
  }
  .sub { color: var(--dim); font-size: 11.5px; line-height: 1.5; margin-bottom: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 2px; padding: 14px 12px; margin-bottom: 12px;
  }
  .exo-name {
    font-family: Oswald, sans-serif; font-weight: 600; font-size: 19px;
    text-transform: uppercase; letter-spacing: .03em;
  }
  .exo-meta { color: var(--dim); font-size: 11px; margin: 3px 0 6px; }
  .reason { color: var(--amber); font-size: 11.5px; line-height: 1.5; margin-bottom: 14px; }
  .note { color: var(--dim); font-size: 11px; font-style: italic; margin-top: 10px; line-height: 1.5; }

  /* Une série = une ligne : [−] charge [+] · reps [−][+].
     La charge est l'élément le plus lourd de l'écran ; sa cible calculée
     reste inscrite en filigrane sous la saisie, l'écart s'affiche en chip. */
  .set-row {
    display: grid; grid-template-columns: 56px minmax(0,1fr) 56px auto;
    gap: 6px; align-items: stretch; margin-bottom: 12px;
  }
  .btn {
    min-width: 56px; min-height: 64px; border-radius: 2px;
    border: 1px solid var(--line); background: #1B1F25; color: var(--txt);
    font-family: Oswald, sans-serif; font-weight: 500; font-size: 26px;
    touch-action: manipulation;
    transition: background .14s ease-out, transform .14s ease-out;
  }
  .btn:active { background: #2A3038; transform: translateY(1px); }
  .w-wrap {
    position: relative; display: flex;
    background: var(--bg); border: 1px solid var(--line); border-radius: 2px;
  }
  .w-input {
    flex: 1; width: 100%; min-width: 0; min-height: 64px; border: 0;
    background: transparent; color: var(--txt); text-align: center;
    font-family: Oswald, sans-serif; font-weight: 700;
    /* Taille fluide : « 137.5 » doit tenir dans la colonne restante après
       les cibles tactiles fixes — 30 px déborde sous 430 px de large. */
    font-size: min(30px, 5.5vw);
    font-variant-numeric: tabular-nums; padding: 0 4px;
  }
  /* Les spinners desktop de type=number mangent la largeur du champ ;
     inutiles ici, les steppers − / + font le travail. */
  .w-input::-webkit-outer-spin-button, .w-input::-webkit-inner-spin-button,
  .r-input::-webkit-outer-spin-button, .r-input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .w-input, .r-input { -moz-appearance: textfield; }
  /* Très petits écrans : on cède 8 px sur les boutons plutôt que de
     tronquer la charge — c'est elle, l'information critique. */
  @media (max-width: 374px) {
    .set-row { grid-template-columns: 48px minmax(0,1fr) 48px auto; gap: 4px; }
    .btn { min-width: 48px; }
    .set-row .r-btn { min-width: 40px; }
    .r-wrap { gap: 4px; }
    .r-input { width: 46px; }
    .w-input { font-size: 5vw; }
  }
  .w-ghost {
    position: absolute; left: 7px; bottom: 3px;
    font-size: 10px; color: var(--ghost); pointer-events: none; white-space: nowrap;
  }
  .w-delta {
    position: absolute; top: -8px; right: 6px; z-index: 1;
    font-size: 11px; font-weight: 600; color: var(--txt);
    background: var(--surface); padding: 0 5px;
  }
  .r-wrap { position: relative; display: flex; gap: 5px; }
  .r-range {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    z-index: 1; font-size: 10px; color: var(--dim);
    background: var(--surface); padding: 0 5px; white-space: nowrap;
  }
  .r-btn { min-width: 44px; }
  .r-input {
    width: 52px; min-height: 64px; text-align: center;
    background: var(--bg); color: var(--txt); border: 1px solid var(--line);
    border-radius: 2px; font-family: Oswald, sans-serif; font-weight: 600;
    font-size: 24px; font-variant-numeric: tabular-nums;
  }

  /* Séries validées : segments craie qui se remplissent au fil de la
     séance (série touchée + reps > 0 + charge renseignée). */
  .segs-row { display: flex; align-items: center; gap: 8px; margin: 2px 0 4px; }
  .segs-label { font-size: 10px; color: var(--dim); }
  .segs { display: flex; gap: 4px; flex: 1; }
  .segs span { flex: 1; height: 5px; background: var(--line); border-radius: 1px;
               transition: background .14s ease-out; }
  .segs span.on { background: var(--txt); }

  /* Bloc superset antagoniste (v2, jalon B) : liseré latéral partagé et
     séries entrelacées A1 → B1 → A2 → B2. Purement visuel — le fichier
     de séance envoyé reste une entrée par exercice (§7). */
  .card.superset { border-left: 2px solid var(--blue-solid); }
  .ss-tag { color: var(--blue); font-size: 10px; font-weight: 600; letter-spacing: .18em; margin-bottom: 6px; }
  .superset .exo-name { font-size: 16px; margin-top: 8px; }
  .ss-label { color: var(--dim); font-size: 11px; margin: 10px 0 12px; }

  /* Bandeau deload (v2, jalon C) : séance volontairement contraignante —
     1 série par exercice, aucun moyen d'en ajouter depuis l'app. */
  .deload-banner {
    background: var(--amber); color: #1A1204;
    font-family: Oswald, sans-serif; font-weight: 600; font-size: 16px;
    text-transform: uppercase; letter-spacing: .05em;
    border-radius: 2px; padding: 16px 12px; margin-bottom: 12px; text-align: center;
  }

  .timer-btn {
    width: 100%; min-height: 56px; margin-top: 8px; border-radius: 2px;
    border: 1px solid var(--blue-solid); background: transparent; color: var(--blue);
    font-family: Oswald, sans-serif; font-weight: 600; font-size: 17px;
    text-transform: uppercase; letter-spacing: .06em;
    font-variant-numeric: tabular-nums; touch-action: manipulation;
    transition: background .14s ease-out, color .14s ease-out;
  }
  .timer-btn.running { background: var(--blue-solid); color: var(--txt); }

  label {
    display: block; color: var(--dim); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: .12em; margin: 12px 0 5px;
  }
  .meta-input, textarea {
    width: 100%; min-height: 56px; font-size: 17px; padding: 8px 12px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    background: var(--bg); color: var(--txt);
    border: 1px solid var(--line); border-radius: 2px;
  }
  textarea { min-height: 72px; font-size: 14px; }
  .send {
    width: 100%; min-height: 64px; margin-top: 14px; border: 0; border-radius: 2px;
    background: var(--blue-solid); color: var(--txt);
    font-family: Oswald, sans-serif; font-weight: 600; font-size: 18px;
    text-transform: uppercase; letter-spacing: .08em;
    transition: transform .14s ease-out;
  }
  .send:active { transform: translateY(1px); }
  .send:disabled { opacity: .5; }
  #status { margin-top: 10px; font-size: 12.5px; line-height: 1.5; min-height: 1.2em; }
  #status.err { color: var(--amber); } #status.ok { color: var(--txt); }
  details { margin-top: 18px; color: var(--dim); font-size: 12.5px; }
  summary { min-height: 44px; display: flex; align-items: center; }

  /* Moletage : hachures fines en séparateur de section. */
  .knurl {
    height: 7px; margin: 18px 0 6px;
    background: repeating-linear-gradient(45deg, var(--line) 0 1px, transparent 1px 5px);
  }
  a.nav {
    display: flex; align-items: center; justify-content: center; min-height: 56px;
    color: var(--blue); text-decoration: none;
    font-family: Oswald, sans-serif; font-weight: 500; font-size: 15px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<h1 id="title">z2h-tracker</h1>
<div class="sub" id="subtitle">Chargement…</div>
<div id="exercises"></div>

<div class="card" id="meta" hidden>
  <label>Date de la séance</label>
  <input class="meta-input" type="date" id="f-date">
  <label>Poids du jour (kg)</label>
  <input class="meta-input" type="number" inputmode="decimal" step="0.1" id="f-bw" placeholder="—">
  <label>Durée (min)</label>
  <input class="meta-input" type="number" inputmode="numeric" id="f-dur" placeholder="—">
  <label>Note libre</label>
  <textarea id="f-notes"></textarea>
  <button class="send" id="send">Enregistrer la séance</button>
  <div id="status"></div>
</div>

<details>
  <summary>⚙️ Réglages (token GitHub)</summary>
  <label>Token fine-grained — scope « Contents: read &amp; write » sur le seul repo de données. Stocké uniquement dans ce navigateur.</label>
  <input class="meta-input" type="password" id="f-token">
  <button type="button" class="btn" style="width:100%;margin-top:8px;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase" id="save-token">Enregistrer le token</button>
  <!-- Numéro de version affiché pour vérifier qu'on n'a pas une vieille
       copie servie par le cache de GitHub Pages. -->
  <div class="note">front v8 — refonte visuelle</div>
</details>
<div class="knurl"></div>
<a class="nav" href="daily.html">Suivi quotidien →</a>
<a class="nav" href="meals.html">Nutrition →</a>
<a class="nav" href="stats.html">Graphes →</a>

<script>
"use strict";
// ------------------------------------------------------------------
// Le front n'a le droit de faire que trois choses (§6) : AFFICHER ce
// que recompute.py a préparé, INCRÉMENTER des champs, ENVOYER un
// fichier de séance. Aucune règle de progression ici.
// ------------------------------------------------------------------
const DATA_OWNER = "Sooap95";
const DATA_REPO  = "z2h-tracker";   // repo privé de données
const BRANCH     = "main";
const API = `https://api.github.com/repos/${DATA_OWNER}/${DATA_REPO}/contents`;

const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem("z2h_token") || "";
let plan = null;          // contenu de next-session.json
let rows = [];            // état de saisie : rows[iExo][iSet] = {weight, reps}
let touched = [];         // séries manipulées cette séance (segments « validé »)

// --- Accès API GitHub ------------------------------------------------
// cache: "no-store" est OBLIGATOIRE (§9) : l'API GitHub cache
// agressivement et renverrait le next-session.json d'AVANT le recalcul.
async function ghGet(path) {
  return fetch(`${API}/${path}?ref=${BRANCH}`, {
    cache: "no-store",
    headers: { Authorization: `Bearer ${token()}`,
               Accept: "application/vnd.github.raw+json" },
  });
}

async function loadPlan() {
  const sub = $("subtitle");
  if (!token()) { sub.textContent = "⚙️ Renseigne d'abord ton token dans les réglages en bas."; return; }
  sub.textContent = "Chargement de la prochaine séance…";
  // Tout passe par un try/catch : un échec silencieux (promesse rejetée)
  // laisserait l'écran figé sans explication — c'est le pire des bugs à
  // diagnostiquer depuis une salle de sport.
  try {
    const res = await ghGet("state/next-session.json");
    if (!res.ok) {
      const hints = {
        401: "token invalide ou expiré",
        403: "accès refusé (scope du token ?)",
        404: "introuvable — le token a-t-il bien accès au repo privé z2h-tracker ?",
      };
      sub.textContent = `Erreur ${res.status} : ${hints[res.status] ?? "réponse inattendue de GitHub"}.`;
      return;
    }
    plan = await res.json();
    render();
  } catch (e) {
    sub.textContent = `Échec réseau ou script : ${e.message}`;
  }
}

// --- Affichage -------------------------------------------------------
function render() {
  $("title").textContent = plan.template_name;
  $("subtitle").textContent = `Préparée d'après la séance du ${plan.based_on_last_session ?? "—"}`;
  const zone = $("exercises");
  zone.innerHTML = "";
  rows = [];

  // Bandeau deload (v2, jalon C) : le plan ne porte qu'une série par
  // exercice et l'app n'offre aucun moyen d'en ajouter — c'est voulu.
  // Pour déroger, éditer le fichier de séance a posteriori.
  if (plan.deload) {
    const banner = document.createElement("div");
    banner.className = "deload-banner";
    banner.textContent = "SEMAINE DE DELOAD — 1 série par exercice, mêmes charges";
    zone.appendChild(banner);
  }

  // Préremplissage : charge = cible calculée (ou vide si première fois,
  // piège n°3) ; reps = rep_max, c'est l'OBJECTIF qu'on corrige à la
  // baisse si on ne l'a pas atteint (§9). `rows` est indexé par la
  // position de l'exercice dans le plan, JAMAIS par sa position à
  // l'écran — l'entrelacement des supersets ne change pas le stockage.
  plan.exercises.forEach((exo) => {
    rows.push(exo.targets.map(t => ({ weight: t.target_weight_kg, reps: t.rep_max })));
  });
  // Les segments « validé » ne comptent que les séries manipulées : le
  // préremplissage seul ne prouve rien, c'est le passage de la série qui
  // remplit le segment. État purement visuel, rien ne part au serveur.
  touched = plan.exercises.map(exo => exo.targets.map(() => false));

  // Regroupement d'AFFICHAGE (v2, jalon B) : les exercices partageant un
  // superset_group forment un bloc unique ; champ absent = carte isolée.
  // Le bloc s'insère à la position du premier exercice du groupe.
  const groups = [];
  const groupSlot = new Map();
  plan.exercises.forEach((exo, i) => {
    if (exo.superset_group == null) { groups.push([i]); return; }
    if (groupSlot.has(exo.superset_group)) {
      groupSlot.get(exo.superset_group).push(i);
    } else {
      const slot = [i];
      groupSlot.set(exo.superset_group, slot);
      groups.push(slot);
    }
  });
  groups.forEach((indices) => {
    zone.appendChild(indices.length > 1 ? supersetCard(indices) : soloCard(indices[0]));
  });

  $("f-date").value = new Date().toISOString().slice(0, 10);
  $("meta").hidden = false;
}

// --- Cartes d'exercice -----------------------------------------------
function exoHeader(exo, prefix) {
  return `
      <div class="exo-name">${prefix}${exo.name}</div>
      <div class="exo-meta">${exo.set_type} · repos ${fmtRest(exo.rest_s)}
        · dernière fois : ${exo.last_done_on ?? "jamais"}</div>
      <div class="reason">${exo.reason}</div>`;
}

function soloCard(i) {
  const exo = plan.exercises[i];
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = exoHeader(exo, "");
  exo.targets.forEach((t, j) => card.appendChild(setRow(i, j)));
  card.appendChild(segStrip(i, ""));
  card.appendChild(timerBtn(exo.rest_s, ""));
  appendNote(card, exo.note);
  return card;
}

// Bloc superset antagoniste : un seul bloc visuel, les séries dans
// l'ordre réel d'exécution (A1 → B1 → A2 → B2 → A3 → B3). Le chrono de
// repos reste PAR exercice, pas par groupe.
function supersetCard(indices) {
  const letter = (k) => String.fromCharCode(65 + k);   // 0 → A, 1 → B…
  const card = document.createElement("div");
  card.className = "card superset";
  card.innerHTML = `<div class="ss-tag">SUPERSET</div>` +
    indices.map((i, k) => exoHeader(plan.exercises[i], `${letter(k)} · `)).join("");
  const maxSets = Math.max(...indices.map(i => plan.exercises[i].targets.length));
  for (let j = 0; j < maxSets; j++) {
    indices.forEach((i, k) => {
      const exo = plan.exercises[i];
      if (j >= exo.targets.length) return;
      const label = document.createElement("div");
      label.className = "ss-label";
      label.textContent = `${letter(k)}${j + 1} · ${exo.name}`;
      card.appendChild(label);
      card.appendChild(setRow(i, j));
    });
  }
  indices.forEach((i, k) => card.appendChild(segStrip(i, letter(k))));
  indices.forEach((i, k) => {
    card.appendChild(timerBtn(plan.exercises[i].rest_s, `${letter(k)} · `));
  });
  indices.forEach((i) => appendNote(card, plan.exercises[i].note));
  return card;
}

// Une série = une ligne : [−] charge [+] · fourchette · reps [−][+].
// La cible calculée reste en filigrane sous la saisie ; dès qu'on s'en
// écarte, l'écart signé s'affiche en chip — la preuve, pas un message.
function setRow(i, j) {
  const exo = plan.exercises[i];
  const t = exo.targets[j];
  const row = document.createElement("div");
  row.className = "set-row";
  row.innerHTML = `
    <button class="btn" data-a="w-" aria-label="moins">−</button>
    <div class="w-wrap">
      <span class="w-delta" hidden></span>
      <input class="w-input" type="number" inputmode="decimal"
             step="${exo.increment_kg}" placeholder="kg"
             value="${t.target_weight_kg ?? ""}">
      <span class="w-ghost">${t.target_weight_kg != null ? `cible ${t.target_weight_kg}` : ""}</span>
    </div>
    <button class="btn" data-a="w+" aria-label="plus">+</button>
    <div class="r-wrap">
      <span class="r-range">${t.rep_min}–${t.rep_max}</span>
      <button class="btn r-btn" data-a="r-">−</button>
      <input class="r-input" type="number" inputmode="numeric" value="${t.rep_max}">
      <button class="btn r-btn" data-a="r+">+</button>
    </div>`;

  const [wInput, rInput] = [row.querySelector(".w-input"), row.querySelector(".r-input")];
  const deltaEl = row.querySelector(".w-delta");
  const updateDelta = () => {
    const cur = wInput.value === "" ? null : parseFloat(wInput.value);
    const d = (t.target_weight_kg != null && cur != null)
      ? +(cur - t.target_weight_kg).toFixed(2) : 0;
    deltaEl.hidden = !d;
    if (d) deltaEl.textContent = (d > 0 ? "+" : "−") + Math.abs(d);
  };
  const mark = () => { touched[i][j] = true; updateSegs(i); updateDelta(); };
  // Les steppers écrivent dans `rows` ; le clavier reste possible en
  // tapant le champ, mais rien n'est obligatoire à taper (§9).
  row.addEventListener("click", (ev) => {
    const a = ev.target.dataset?.a;
    if (!a) return;
    if (a[0] === "w") {
      // Charge vide (première fois) : le premier tap part de 0.
      const cur = parseFloat(wInput.value) || 0;
      const next = Math.max(0, cur + (a[1] === "+" ? 1 : -1) * exo.increment_kg);
      wInput.value = +next.toFixed(2);
    } else {
      const cur = parseInt(rInput.value) || 0;
      rInput.value = Math.max(0, cur + (a[1] === "+" ? 1 : -1));
    }
    sync(i, j, wInput, rInput);
    mark();
  });
  row.addEventListener("input", () => { sync(i, j, wInput, rInput); mark(); });
  return row;
}

// Segments de séries validées — remplis quand la série a été manipulée
// et qu'elle partira dans le fichier (reps > 0, charge renseignée).
function segStrip(i, label) {
  const wrap = document.createElement("div");
  wrap.className = "segs-row";
  if (label) {
    const l = document.createElement("span");
    l.className = "segs-label"; l.textContent = label;
    wrap.appendChild(l);
  }
  const s = document.createElement("div");
  s.className = "segs"; s.dataset.exo = i;
  plan.exercises[i].targets.forEach(() => s.appendChild(document.createElement("span")));
  wrap.appendChild(s);
  return wrap;
}

function updateSegs(i) {
  document.querySelectorAll(`.segs[data-exo="${i}"] span`).forEach((sp, j) => {
    const s = rows[i][j];
    sp.classList.toggle("on", touched[i][j] && s.reps > 0 && s.weight !== null);
  });
}

// Chrono de repos préréglé par exercice, vibration à zéro (§9).
function timerBtn(rest_s, prefix) {
  const timer = document.createElement("button");
  timer.className = "timer-btn";
  timer.textContent = `▶ Repos ${prefix}${fmtRest(rest_s)}`;
  timer.addEventListener("click", () => startTimer(timer, rest_s, prefix));
  return timer;
}

function appendNote(card, text) {
  if (!text) return;
  const note = document.createElement("div");
  note.className = "note"; note.textContent = text;
  card.appendChild(note);
}

function sync(i, j, wInput, rInput) {
  rows[i][j] = {
    weight: wInput.value === "" ? null : parseFloat(wInput.value),
    reps: parseInt(rInput.value) || 0,
  };
}

function fmtRest(s) { return `${Math.floor(s / 60)}'${String(s % 60).padStart(2, "0")}`; }

// --- Chrono de repos -------------------------------------------------
// `prefix` : lettre de l'exercice dans un bloc superset ("A · "), vide
// pour une carte isolée — chaque exercice garde SON chrono.
function startTimer(btn, total, prefix) {
  if (btn.dataset.running) {           // second tap = annulation
    clearInterval(+btn.dataset.running);
    delete btn.dataset.running;
    btn.classList.remove("running");
    btn.textContent = `▶ Repos ${prefix}${fmtRest(total)}`;
    return;
  }
  let left = total;
  btn.classList.add("running");
  const tick = () => {
    btn.textContent = `⏱ ${prefix}${fmtRest(left)}`;
    if (left-- <= 0) {
      clearInterval(+btn.dataset.running);
      delete btn.dataset.running;
      btn.classList.remove("running");
      btn.textContent = `▶ Repos ${prefix}${fmtRest(total)}`;
      if (navigator.vibrate) navigator.vibrate([300, 120, 300]);
    }
  };
  btn.dataset.running = setInterval(tick, 1000);
  tick();
}

// --- Envoi -----------------------------------------------------------
async function send() {
  const date = $("f-date").value;
  if (!date) { return status("Renseigne la date.", true); }
  const session = {
    date,
    template: plan.template,
    duration_min: $("f-dur").value ? +$("f-dur").value : null,
    bodyweight_kg: $("f-bw").value ? +$("f-bw").value : null,
    notes: $("f-notes").value,
    // Drapeau deload recopié tel quel (jalon C) : c'est lui qui fait
    // ignorer cette séance par la recherche de dernière performance —
    // sans lui, la progression se figerait après le premier deload.
    ...(plan.deload ? { deload: true } : {}),
    exercises: plan.exercises.map((exo, i) => ({
      id: exo.id,
      // On n'envoie que les séries réellement faites (reps > 0 et charge
      // renseignée — 0 kg est valide : tractions non lestées).
      sets: rows[i].filter(s => s.reps > 0 && s.weight !== null)
                   .map(s => ({ weight_kg: s.weight, reps: s.reps })),
    })).filter(e => e.sets.length > 0),
  };
  if (session.exercises.length === 0) { return status("Aucune série remplie.", true); }

  const path = `data/sessions/${date}_${plan.template}.json`;
  $("send").disabled = true;
  status("Envoi…");
  try {
    // Si le fichier du jour existe déjà (reprise de saisie), l'API exige
    // son sha pour accepter l'écrasement. Requête métadonnées (sans
    // Accept raw), sinon le sha n'est pas dans la réponse.
    let sha;
    const head = await fetch(`${API}/${path}?ref=${BRANCH}`, {
      cache: "no-store",
      headers: { Authorization: `Bearer ${token()}` },
    });
    if (head.ok) sha = (await head.json()).sha;
    const res = await fetch(`${API}/${path}`, {
      method: "PUT",
      headers: { Authorization: `Bearer ${token()}`,
                 Accept: "application/vnd.github+json" },
      body: JSON.stringify({
        message: `Séance ${date} ${plan.template}`,
        branch: BRANCH,
        // btoa ne digère pas l'UTF-8 brut (accents des notes) → détour
        // par encodeURIComponent.
        content: btoa(unescape(encodeURIComponent(JSON.stringify(session, null, 2) + "\n"))),
        ...(sha ? { sha } : {}),
      }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    status("✔ Séance enregistrée — le recalcul tourne, la prochaine séance sera prête dans ~1 min.", false, true);
  } catch (e) {
    status(`Échec de l'envoi (${e.message}). Les données restent à l'écran, réessaie.`, true);
    $("send").disabled = false;
  }
}

function status(msg, isErr, isOk) {
  const el = $("status");
  el.textContent = msg;
  el.className = isErr ? "err" : isOk ? "ok" : "";
}

// --- Init ------------------------------------------------------------
$("save-token").addEventListener("click", () => {
  const value = $("f-token").value.trim();
  if (!value) { $("subtitle").textContent = "Le champ token est vide."; return; }
  // localStorage peut être interdit (navigation privée iOS, file:// selon
  // le navigateur) : sans catch, le clic échouerait sans AUCUN retour.
  try {
    localStorage.setItem("z2h_token", value);
  } catch (e) {
    $("subtitle").textContent = `Stockage impossible (${e.name}) — navigation privée ? Le token ne peut pas être retenu.`;
    return;
  }
  $("f-token").value = "";
  $("subtitle").textContent = "Token enregistré ✔";
  loadPlan();
});
$("send").addEventListener("click", send);
loadPlan();
</script>
