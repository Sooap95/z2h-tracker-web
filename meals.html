<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>z2h — nutrition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Même charte que index.html — direction « instrument de mesure ». */
  :root {
    --bg: #0B0C0E; --surface: #14161A; --line: #262A30;
    --txt: #E6E4DE; --dim: #8A8F98; --ghost: #565B63;
    --blue: #7FA5F5; --blue-solid: #2F62C9; --amber: #D9A13B;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    padding: 12px 10px calc(28px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  a { color: var(--blue); } a:hover { color: #A8C2F8; }
  h1 {
    font-family: Oswald, sans-serif; font-weight: 700; font-size: 26px;
    text-transform: uppercase; letter-spacing: .02em; margin: 8px 0 2px;
  }
  .sub { color: var(--dim); font-size: 11.5px; line-height: 1.5; margin-bottom: 14px; min-height: 1.2em; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 2px; padding: 14px 12px; margin-bottom: 12px;
  }
  /* Le total du jour est la mesure dominante de l'écran. */
  .total {
    font-family: Oswald, sans-serif; font-weight: 700; font-size: 44px;
    line-height: 1.1; font-variant-numeric: tabular-nums;
  }
  .macros { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .logged { font-size: 11.5px; color: var(--dim); line-height: 1.6; margin-top: 10px; }
  .undo {
    width: 100%; min-height: 48px; margin-top: 10px; border-radius: 2px;
    border: 1px solid var(--line); background: #1B1F25; color: var(--txt);
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px;
    transition: background .14s ease-out;
  }
  .undo:active { background: #2A3038; }
  details.menu {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 2px; padding: 0 12px; margin-bottom: 10px;
  }
  details.menu summary {
    min-height: 56px; display: flex; align-items: center; gap: 10px;
    justify-content: space-between;
    font-family: Oswald, sans-serif; font-weight: 600; font-size: 16px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  summary .k {
    color: var(--dim); font-weight: 400; font-size: 11px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    text-transform: none; letter-spacing: 0; text-align: right;
  }
  .meal { display: flex; align-items: center; gap: 8px; padding: 10px 0;
          border-top: 1px solid var(--line); }
  .meal-info { flex: 1; min-width: 0; }
  .meal-name { font-weight: 600; font-size: 13.5px; line-height: 1.4; }
  .meal-detail { color: var(--dim); font-size: 11px; line-height: 1.5; font-weight: 400; }
  .add {
    min-width: 56px; min-height: 56px; border-radius: 2px; flex-shrink: 0;
    border: 1px solid var(--blue-solid); background: transparent; color: var(--blue);
    font-family: Oswald, sans-serif; font-size: 26px; touch-action: manipulation;
    transition: background .14s ease-out, color .14s ease-out;
  }
  .add:active { background: var(--blue-solid); color: var(--txt); }
  .add:disabled { opacity: .4; }
  #status { margin: 8px 0 0; font-size: 12.5px; line-height: 1.5; min-height: 1.2em; }
  #status.err { color: var(--amber); } #status.ok { color: var(--txt); }
  .tip { color: var(--dim); font-size: 11px; font-style: italic; line-height: 1.6; margin: 10px 0; }
  .knurl {
    height: 7px; margin: 18px 0 6px;
    background: repeating-linear-gradient(45deg, var(--line) 0 1px, transparent 1px 5px);
  }
  a.nav {
    display: flex; align-items: center; justify-content: center; min-height: 56px;
    color: var(--blue); text-decoration: none;
    font-family: Oswald, sans-serif; font-weight: 500; font-size: 15px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<h1>Nutrition</h1>
<div class="sub" id="subtitle">Chargement…</div>

<div class="card">
  <div class="total" id="total">— kcal</div>
  <div class="macros" id="total-macros"></div>
  <div class="logged" id="logged"></div>
  <button type="button" class="undo" id="undo" hidden>Annuler le dernier repas</button>
  <div id="status"></div>
</div>

<div id="menus"></div>
<div class="tip" id="tip"></div>

<div class="knurl"></div>
<a class="nav" href="index.html">← Séance</a>
<a class="nav" href="daily.html">← Suivi quotidien</a>
<a class="nav" href="stats.html">Graphes →</a>

<script>
"use strict";
// Écran nutrition (§10 jalon 6) : les 5 menus types en presets, un tap =
// un repas loggé dans data/meals.csv. Le référentiel (menus, macros)
// vient de program/meals.json — rien n'est chiffré ici.
const DATA_OWNER = "Sooap95";
const DATA_REPO  = "z2h-tracker";
const BRANCH     = "main";
const CONTENTS = `https://api.github.com/repos/${DATA_OWNER}/${DATA_REPO}/contents`;
const CSV_API = `${CONTENTS}/data/meals.csv`;
const HEADER = "date,meal,kcal,carbs_g,protein_g,fat_g";

const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem("z2h_token") || "";
const today = () => new Date().toISOString().slice(0, 10);

let csvLines = [HEADER];
let csvSha = null;
let targetKcal = null;

async function ghRaw(path) {
  const res = await fetch(`${CONTENTS}/${path}?ref=${BRANCH}`, {
    cache: "no-store",
    headers: { Authorization: `Bearer ${token()}`,
               Accept: "application/vnd.github.raw+json" },
  });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error(`HTTP ${res.status} sur ${path}`);
  return res.text();
}

async function loadAll() {
  const sub = $("subtitle");
  if (!token()) { sub.textContent = "⚙️ Renseigne ton token sur l'écran séance."; return; }
  try {
    const [mealsTxt, protoTxt] = await Promise.all([
      ghRaw("program/meals.json"), ghRaw("program/protocol.json"),
    ]);
    // Le CSV se charge avec sha (nécessaire pour réécrire).
    const res = await fetch(`${CSV_API}?ref=${BRANCH}`, {
      cache: "no-store", headers: { Authorization: `Bearer ${token()}` } });
    if (res.ok) {
      const meta = await res.json();
      csvSha = meta.sha;
      csvLines = decodeURIComponent(escape(atob(meta.content.replace(/\n/g, "")))).trim().split("\n");
    }
    targetKcal = protoTxt ? JSON.parse(protoTxt).target_kcal : null;
    renderMenus(JSON.parse(mealsTxt));
    renderTotals();
    sub.textContent = "";
  } catch (e) {
    sub.textContent = `Échec de chargement : ${e.message}`;
  }
}

function todayEntries() {
  return csvLines.slice(1)
    .map(l => l.split(","))
    .filter(f => f[0] === today())
    .map(f => ({ meal: f[1], kcal: +f[2], g: +f[3], p: +f[4], l: +f[5] }));
}

function renderTotals() {
  const e = todayEntries();
  const sum = (k) => e.reduce((t, x) => t + x[k], 0);
  $("total").textContent = `${sum("kcal")} kcal` +
    (targetKcal ? ` / ${targetKcal}` : "");
  $("total-macros").textContent =
    `G ${sum("g")} · P ${sum("p")} · L ${sum("l")} (g)`;
  $("logged").textContent = e.length
    ? "Aujourd'hui : " + e.map(x => x.meal).join(" · ")
    : "Aucun repas loggé aujourd'hui.";
  $("undo").hidden = e.length === 0;
}

function mealRow(m) {
  const row = document.createElement("div");
  row.className = "meal";
  row.innerHTML = `
    <div class="meal-info">
      <div class="meal-name">${m.name} <span class="meal-detail">${m.kcal} kcal · G ${m.g}/P ${m.p}/L ${m.l}</span></div>
      ${m.composition ? `<div class="meal-detail">${m.composition}</div>` : ""}
    </div>
    <button type="button" class="add" aria-label="logger ${m.name}">＋</button>`;
  row.querySelector(".add").addEventListener("click", (ev) => logMeal(m, ev.target));
  return row;
}

function renderMenus(data) {
  const zone = $("menus");
  data.menus.forEach(menu => {
    const d = document.createElement("details");
    d.className = "menu";
    d.innerHTML = `<summary>${menu.name}
      <span class="k">${menu.kcal} kcal · G ${menu.macros.g}/P ${menu.macros.p}/L ${menu.macros.l}</span></summary>`;
    menu.meals.forEach(m => d.appendChild(mealRow(m)));
    zone.appendChild(d);
  });
  const ext = document.createElement("details");
  ext.className = "menu";
  ext.innerHTML = `<summary>Je mange dehors <span class="k">presets restaurant</span></summary>`;
  data.external.forEach(m => ext.appendChild(mealRow(m)));
  zone.appendChild(ext);
  $("tip").textContent = data.restaurant_tip;
}

// --- Écritures --------------------------------------------------------
async function pushCsv(lines, message) {
  const res = await fetch(CSV_API, {
    method: "PUT",
    headers: { Authorization: `Bearer ${token()}`, Accept: "application/vnd.github+json" },
    body: JSON.stringify({
      message, branch: BRANCH,
      content: btoa(unescape(encodeURIComponent(lines.join("\n") + "\n"))),
      ...(csvSha ? { sha: csvSha } : {}),
    }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  csvSha = (await res.json()).content.sha;
  csvLines = lines;
  renderTotals();
}

async function logMeal(m, btn) {
  btn.disabled = true;
  status("Envoi…");
  try {
    // Le nom part en CSV : les virgules éventuelles deviennent des points-virgules.
    const line = [today(), m.name.replace(/,/g, ";"), m.kcal, m.g, m.p, m.l].join(",");
    await pushCsv([...csvLines, line], `Repas ${today()} : ${m.name}`);
    status(`✔ ${m.name} loggé.`, false, true);
  } catch (e) {
    status(`Échec (${e.message}) — réessaie.`, true);
  } finally {
    btn.disabled = false;
  }
}

async function undoLast() {
  const idx = csvLines.map((l, i) => l.startsWith(today() + ",") ? i : -1)
    .filter(i => i > 0).pop();
  if (idx === undefined) return;
  $("undo").disabled = true;
  status("Annulation…");
  try {
    const removed = csvLines[idx].split(",")[1];
    await pushCsv(csvLines.filter((_, i) => i !== idx), `Annulation repas : ${removed}`);
    status(`✔ ${removed} retiré.`, false, true);
  } catch (e) {
    status(`Échec (${e.message}) — réessaie.`, true);
  } finally {
    $("undo").disabled = false;
  }
}

function status(msg, isErr, isOk) {
  const el = $("status");
  el.textContent = msg;
  el.className = isErr ? "err" : isOk ? "ok" : "";
}

$("undo").addEventListener("click", undoLast);
loadAll();
</script>
</body>
</html>
